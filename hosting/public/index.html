<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaLog</title>
<meta name="description" content="AquaLog: smarter care for healthier aquariums.">
<style>
  :root { --bg: #f1f7fc; --text: #0b1b36; --muted: #52688a; --accent: #0891b2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #040a16; --text: #e8f4ff; --muted: #8fa8c8; --accent: #22d3ee; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  main { padding: 24px 16px; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 2.25rem; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>AquaLog</h1>
  <p>Smarter care for healthier aquariums.</p>
  <a href="/privacy">Privacy Policy</a>
</main>
</body>
</html>
